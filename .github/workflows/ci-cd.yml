name: CI/CD - Swamini LMS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/swamini9403/swamini-lms-backend
  FRONTEND_IMAGE: ghcr.io/swamini9403/swamini-lms-frontend

jobs:
  # ---------------------------------------------------------------- 1. Django tests
  backend-test:
    name: Backend tests (Django + MySQL + Redis)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lms
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=3s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t swamini-lms-backend:ci ./backend
      - name: Run Django checks and tests inside the container
        run: |
          docker run --rm --network host \
            -e MYSQL_HOST=127.0.0.1 -e MYSQL_USER=root -e MYSQL_PASSWORD=root -e MYSQL_DATABASE=lms \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            swamini-lms-backend:ci sh -c "python manage.py check && python manage.py test -v 2"

  # ---------------------------------------------------------------- 2. Angular build
  frontend-build:
    name: Frontend build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration production
      - uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: frontend/dist/frontend/browser
          retention-days: 7

  # ---------------------------------------------------------------- 3. Compose integration test
  compose-integration:
    name: Docker Compose integration test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: |
          cp .env.example .env
          sed -i 's/^APP_PORT=.*/APP_PORT=8080/' .env
          docker compose up -d --build
      - name: Wait for the stack to become healthy
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8080/api/health/ >/dev/null; then echo "Stack is healthy"; break; fi
            echo "waiting ($i)..."; sleep 5
          done
          docker compose ps
      - name: Smoke-test endpoints through Nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q "<app-root>"
          curl -fsS http://localhost:8080/api/health/ | tee /dev/stderr | grep -q '"healthy"'
          curl -fsS -D - http://localhost:8080/api/courses/ -o /dev/null | grep -i "x-cache"
          curl -fsS -D - http://localhost:8080/api/courses/ -o /dev/null | grep -i "x-cache: HIT"
      - name: Verify MySQL data survives container re-creation (persistent volume)
        run: |
          curl -fsS -X POST http://localhost:8080/api/enrollments/ -H 'Content-Type: application/json' \
            -d '{"course":1,"student_name":"CI Bot","student_email":"ci@example.com"}'
          docker compose down            # removes containers, keeps the named volume
          docker volume ls | grep swamini_mysql_data
          docker compose up -d
          for i in $(seq 1 40); do curl -fs http://localhost:8080/api/health/ >/dev/null && break; sleep 5; done
          curl -fsS http://localhost:8080/api/enrollments/ | grep -q "ci@example.com" && echo "Data persisted across restart"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------- 4. Build & push images
  build-and-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    needs: compose-integration
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------- 5. Deploy to AWS EC2
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    # Runs once the EC2_HOST repository variable is configured
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.EC2_HOST != ''
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Create production .env
        run: |
          cat > .env <<EOF
          APP_PORT=80
          IMAGE_TAG=${IMAGE_TAG}
          BACKEND_IMAGE=${BACKEND_IMAGE}
          FRONTEND_IMAGE=${FRONTEND_IMAGE}
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=*
          MYSQL_DATABASE=lms
          MYSQL_USER=lms_user
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          EOF
      - name: Copy files to EC2
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" "mkdir -p ~/swamini-lms"
          scp -i ~/.ssh/ec2.pem docker-compose.yml .env deploy/ec2-setup.sh "$EC2_USER@$EC2_HOST:~/swamini-lms/"
      - name: Install Docker (first run only), pull images and restart the stack
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" "bash ~/swamini-lms/ec2-setup.sh"
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" \
            "sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" "cd ~/swamini-lms && \
            sudo docker compose pull && \
            sudo docker compose up -d --no-build --remove-orphans && \
            sudo docker image prune -f && \
            sudo docker logout ghcr.io && \
            sudo docker compose ps"
      - name: Verify deployment
        run: |
          for i in $(seq 1 30); do
            if curl -fs "http://$EC2_HOST/api/health/"; then echo; echo "Live at http://$EC2_HOST"; exit 0; fi
            echo "waiting ($i)..."; sleep 10
          done
          exit 1
