# Swamini LMS — Angular + Django REST + Redis + MySQL
# Local:  docker compose up -d --build        (http://localhost:${APP_PORT})
# EC2:    images are pulled from GHCR by the GitHub Actions deploy job

name: swamini-lms

services:
  mysql:
    image: mysql:8.4
    container_name: swamini-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms}
      MYSQL_USER: ${MYSQL_USER:-lms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lms_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql          # persistent volume for all database files
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend_net]

  redis:
    image: redis:7-alpine
    container_name: swamini-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend_net]

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-swamini-lms-backend}:${IMAGE_TAG:-latest}
    container_name: swamini-backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms}
      MYSQL_USER: ${MYSQL_USER:-lms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lms_password}
      REDIS_URL: redis://redis:6379/0
      APP_VERSION: ${IMAGE_TAG:-latest}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend_net, frontend_net]

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-swamini-lms-frontend}:${IMAGE_TAG:-latest}
    container_name: swamini-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [frontend_net]

volumes:
  mysql_data:
    name: swamini_mysql_data
  redis_data:
    name: swamini_redis_data

networks:
  frontend_net:
    name: swamini_frontend_net
  backend_net:
    name: swamini_backend_net
